<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UNVT Map 3D</title>
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <script src="./public/maplibre-gl@5.3.0/maplibre-gl.js"></script>
    <link href="./public/maplibre-gl@5.3.0/maplibre-gl.css" rel="stylesheet" />
    <link
      href="./public/watergis/maplibre-gl-legend@2.0.5/maplibre-gl-legend.css"
      rel="stylesheet"
    />
    <script src="./public/watergis/maplibre-gl-legend@2.0.5/maplibre-gl-legend.umd.js"></script>
    <!-- PMTiles -->
    <script src="./public/pmtiles@4.3.0/pmtiles.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script>
      // PMTiles protocol
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol('pmtiles', protocol.tile);

      var map = new maplibregl.Map({
        container: 'map',
        attributionControl: true,
        hash: true,
        style: './public/styles/style-el.json', // style file path
        center: [0, 0], // center [lng, lat]
        zoom: 1, // zoom level at loading
        minZoom: 0, // min zoom
        maxZoom: 17, // max zoom
        maxPitch: 85,
      });

      map.on('load', () => {
        map.setTerrain({
          source: 'dem',
          exaggeration: 1,
        });
      });

      //UI
      //map.addControl(new maplibregl.AttributionControl({customAttribution: "<a href='https://geoportal.un.org/arcgis/apps/sites/#/unitemaps'><img src='https://geoportal.un.org/webapps/resources/LOGOS/PoweredbyUniteMaps.png' alt='Powered by Unite Maps'></a> <a href='http://unopengis.org/unopengis/main/main.php'><img src='https://unopengis.github.io/watermark/watermark.png' alt='UN OpenGIS' style='width:40px;height:40px;'></a>" }));
      map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
      map.addControl(new maplibregl.ScaleControl());

      //legend
      const LegendModule = window.MaplibreLegendControl;

      map.addControl(
        new LegendModule.MaplibreLegendControl(
          {},
          {
            showDefault: false,
            onlyRendered: true,
            reverseOrder: false,
          },
        ),
        'bottom-left',
      );

      //debug
      map.showTileBoundaries = false;
      map.showCollisionBoxes = false;
    </script>
  </body>
</html>
